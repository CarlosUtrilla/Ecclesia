name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SKIP_PRISMA_GENERATE: 'true'
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Copy @prisma/client to root node_modules
        run: node -e "const fs=require('fs');const path=require('path');const src='apps/api/node_modules/@prisma/client';const dest='node_modules/@prisma/client';fs.mkdirSync(path.dirname(dest),{recursive:true});fs.cpSync(src,dest,{recursive:true,dereference:true});console.log('Copied @prisma/client to root node_modules')"

      - name: Generate Prisma client
        env:
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build sidecar
        run: pnpm build:sidecar

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/tauri
          args: --target ${{ matrix.target }}
