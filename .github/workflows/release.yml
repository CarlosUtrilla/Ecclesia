name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SKIP_PRISMA_GENERATE: 'true'
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workdir: apps/tauri/src-tauri

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install @prisma/client at root
        run: pnpm add -w @prisma/client

      - name: Generate Prisma client
        env:
          PRISMA_GENERATE_SKIP_AUTOINSTALL: 'true'
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build sidecar
        run: pnpm build:sidecar

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        working-directory: apps/tauri
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
