[package]
name = "ecclesia"
version = "0.15.6"
description = "Ecclesia - Planificación y presentación de cultos religiosos"
authors = ["Ecclesia Team"]
edition = "2021"

[lib]
name = "ecclesia_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-utils = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
