appId: com.ecclesia.app
productName: Ecclesia
directories:
  buildResources: build
files:
  - '**/*'
  - from: 'node_modules/.prisma'
    to: 'node_modules/.prisma'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!node_modules/@ecclesia/**/*'
  - '!../../apps/api/**'
  - '!../../packages/queries/**'
extraResources:
  - from: ../../apps/api/prisma
    to: prisma
    filter:
      - '**/migrations/**'
      - 'schema.prisma'
      - 'empty-prod.db'
      - '!dev.db-journal'
  - from: resources/bibles
    to: bibles
    filter:
      - '**/*.ebbl'
asarUnpack:
  - resources/**
  - node_modules/.prisma/**
  - node_modules/@prisma/**
  - node_modules/prisma/**
  - node_modules/@ffmpeg-installer/**
  - node_modules/@img/**
  - node_modules/sharp/**
  - node_modules/better-sqlite3/**
  - node_modules/@napi-rs/**
  - node_modules/@stagetimerio/grandiose/dist/**
win:
  executableName: Ecclesia
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
afterPack: ../../packages/scripts/after-pack.cjs
beforePack: ../../packages/scripts/before-pack.cjs
mac:
  identity: null
  notarize: false
  singleArchFiles: '**/Contents/Frameworks/*Framework.framework/**/_CodeSignature/**'
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSLocalNetworkUsageDescription: Ecclesia publica la salida de vídeo NDI y descubre dispositivos en la red local.
    - NSBonjourServices:
        - _ndi._tcp
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: CarlosUtrilla
  repo: Ecclesia
  channel: latest
  releaseType: release
